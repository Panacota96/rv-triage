[package]
name = "rv-triage-core"
description = "RV Triage core: evidence intake, dual hashing, audit chain, analysis and reports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "rv_triage_core"
path = "src/lib.rs"

[dependencies]
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
blake3.workspace = true
digest.workspace = true
serde.workspace = true
serde_json.workspace = true
minijinja.workspace = true
chrono.workspace = true
walkdir.workspace = true
ureq.workspace = true
p12-keystore.workspace = true
cms.workspace = true
x509-tsp.workspace = true
x509-cert.workspace = true
der.workspace = true
spki.workspace = true
const-oid.workspace = true
rsa.workspace = true
# `oid`: RSA PKCS#1 v1.5 verification of TSA tokens needs the digest OIDs.
sha2-legacy = { workspace = true, features = ["oid"] }

# Live collection on Windows (host facts + volatile capture): raw Win32 bindings, read-only APIs only.
# windows-sys 0.61 is already in Cargo.lock (no new crate versions); MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile.workspace = true
